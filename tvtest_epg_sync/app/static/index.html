<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TVTest EPG Sync</title>
  <link rel="stylesheet" href="__BASE_PATH__/static/guide.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>TVTest EPG Sync</h1>
      <p id="connection" class="connection">番組表を読み込んでいます…</p>
    </div>
    <nav class="tabs" aria-label="表示切り替え">
      <button class="tab active" type="button" data-view="guide" aria-selected="true">番組表</button>
      <button class="tab" type="button" data-view="status" aria-selected="false">同期状態</button>
    </nav>
  </header>

  <main>
    <section id="guide-view" class="view active" aria-label="番組表">
      <div class="toolbar">
        <button id="prev-day" type="button" title="前日">‹</button>
        <label><span class="sr-only">表示日</span><input id="guide-date" type="date"></label>
        <button id="next-day" type="button" title="翌日">›</button>
        <button id="today" type="button">今日</button>
        <button id="now" type="button">現在時刻</button>
        <label class="network-filter">放送波
          <select id="network-filter">
            <option value="all" selected>すべて</option>
            <option value="terrestrial">地デジ</option>
            <option value="bs">BS</option>
            <option value="cs">CS</option>
            <option value="other">その他</option>
          </select>
        </label>
        <label class="service-filter">サービス
          <select id="service-filter">
            <option value="main" selected>主要のみ</option>
            <option value="all">すべて</option>
          </select>
        </label>
        <label class="zoom">高さ
          <select id="zoom">
            <option value="1">小</option>
            <option value="2" selected>標準</option>
            <option value="3">大</option>
          </select>
        </label>
        <span id="guide-summary" class="summary"></span>
      </div>

      <div class="genre-bar" role="group" aria-label="ジャンルで絞り込む">
        <span class="genre-label">ジャンル</span>
        <button id="genre-all" class="genre-chip active" type="button" aria-pressed="true">すべて</button>
        <span id="genre-chips"></span>
      </div>

      <div id="guide-message" class="message" hidden></div>
      <div id="guide-grid" class="guide-grid" hidden>
        <div class="grid-corner">時刻</div>
        <div class="channel-viewport"><div id="channel-headers" class="channel-headers"></div></div>
        <div class="time-viewport"><div id="time-axis" class="time-axis"></div></div>
        <div id="program-viewport" class="program-viewport" tabindex="0">
          <div id="program-canvas" class="program-canvas"></div>
        </div>
      </div>
    </section>

    <section id="status-view" class="view" aria-label="同期状態">
      <div id="status-cards" class="status-cards"></div>
      <div id="status-list" class="status-list"></div>
      <h2 class="status-heading">番組表の取得</h2>
      <div id="status-runners" class="status-list"></div>
      <noscript><p>JavaScriptを有効にするか、<a href="__BASE_PATH__/status">簡易状態画面</a>を開いてください。</p></noscript>
    </section>
  </main>

  <dialog id="event-dialog" class="event-dialog">
    <form method="dialog"><button class="dialog-close" aria-label="閉じる">×</button></form>
    <div id="event-detail"></div>
  </dialog>

  <script>window.EPGSYNC_BASE = __BASE_JSON__;</script>
  <script src="__BASE_PATH__/static/guide-layout.js"></script>
  <script src="__BASE_PATH__/static/guide.js"></script>
</body>
</html>
