name: Build JK EPG

on:
  push:
    paths:
      - "jk_epg/**"
      - ".github/workflows/jk-epg-build.yml"
  pull_request:
    paths:
      - "jk_epg/**"
      - ".github/workflows/jk-epg-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build add-on image
        uses: docker/build-push-action@v6
        with:
          context: ./jk_epg
          platforms: ${{ matrix.platform }}
          push: false
          tags: jk-epg:test-${{ matrix.arch }}
          cache-from: type=gha,scope=jk-epg-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=jk-epg-${{ matrix.arch }}
