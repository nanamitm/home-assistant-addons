name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest aiohttp pyyaml paho-mqtt
      - run: pytest -q
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test JK EPG acquisition sources
        run: dotnet test jk_epg/tests/JkEpg.Tests.csproj --configuration Release
      - name: Test JK EPG web UI logic
        run: node --test jk_epg/tests/ui-core.test.js
      - name: Test TVTest EPG Sync guide layout
        run: node --test tvtest_epg_sync/tests/guide-layout.test.js
      - run: node --check jk_epg/app/wwwroot/app.js
      - run: node --check jk_epg/app/wwwroot/ui-core.js
      - run: node --check xgps/app/static/app.js
      - run: node --check tvtest_epg_sync/app/static/guide-layout.js
      - run: node --check tvtest_epg_sync/app/static/guide.js
      - name: Validate add-on configuration
        run: |
          python - <<'PY'
          import pathlib

          import yaml

          ADDONS = ("gps_ntp", "sdrconnect", "tvtest_epg_sync", "xgps")


          def dockerfile(addon):
              return pathlib.Path(f"{addon}/Dockerfile").read_text()


          for addon in ADDONS:
              config = yaml.safe_load(open(f"{addon}/config.yaml"))
              # The base image must come from a build argument. A literal base follows
              # the architecture of whichever machine runs the build instead of the one
              # being built for.
              from_line = next(
                  line for line in dockerfile(addon).splitlines() if line.startswith("FROM ")
              )
              assert "${BUILD_" in from_line, (addon, from_line)
              # The release notes must describe the version being released.
              changelog = pathlib.Path(f"{addon}/CHANGELOG.md").read_text().splitlines()
              latest = next(line for line in changelog if line.startswith("## "))
              assert latest == f"## {config['version']}", (addon, latest)

          # The Supervisor builds these locally and reads their base from build.yaml.
          for addon in ("gps_ntp", "sdrconnect", "tvtest_epg_sync"):
              config = yaml.safe_load(open(f"{addon}/config.yaml"))
              build = yaml.safe_load(open(f"{addon}/build.yaml"))
              assert "image" not in config, addon
              assert "ARG BUILD_FROM" in dockerfile(addon), addon
              # Every supported architecture needs a base image to build from.
              assert set(build["build_from"]) == set(config["arch"]), addon

          # Every option offered in the interface needs a name and a description.
          for addon in ADDONS:
              options = set(yaml.safe_load(open(f"{addon}/config.yaml"))["schema"])
              for language in ("en", "ja"):
                  translated = yaml.safe_load(
                      open(f"{addon}/translations/{language}.yaml")
                  )["configuration"]
                  assert set(translated) == options, (addon, language)

          config = yaml.safe_load(open("xgps/config.yaml"))
          assert config["slug"] == "xgps_web"
          assert config["ingress"] is True
          assert config["watchdog"] == "http://[HOST]:[PORT:8099]/health"
          assert set(config["arch"]) == {"amd64", "aarch64"}
          assert config["services"] == ["mqtt:want"]
          assert config["options"]["mqtt_enabled"] is False
          assert config["stage"] == "stable"
          # xgps ships a published image built by the Home Assistant builder action.
          # That action passes BUILD_ARCH but never BUILD_FROM, so the Dockerfile has
          # to pick its own base from the architecture and must not expect BUILD_FROM.
          assert "ARG BUILD_ARCH" in dockerfile("xgps")
          assert "${BUILD_ARCH}-base" in dockerfile("xgps")
          assert not pathlib.Path("xgps/build.yaml").exists()
          dashboard = yaml.safe_load(open("xgps/examples/dashboard.yaml"))
          automations = yaml.safe_load(open("xgps/examples/automations.yaml"))
          assert dashboard["views"][0]["cards"]
          assert len(automations) == 4
          assert all(item["trigger"] and item["action"] for item in automations)

          config = yaml.safe_load(open("tvtest_epg_sync/config.yaml"))
          assert config["slug"] == "tvtest_epg_sync"
          assert config["ingress"] is True
          assert set(config["arch"]) == {"amd64", "aarch64"}
          # TVTest connects to this port directly; Ingress only serves the status page.
          assert config["ports"] == {"8077/tcp": 8077}
          assert set(config["ports_description"]) == set(config["ports"])
          assert config["watchdog"] == "http://[HOST]:[PORT:8077]/api/health"
          # The token guards the API, so it must not be readable in the interface.
          assert config["schema"]["token"] == "password?"

          config = yaml.safe_load(open("jk_epg/config.yaml"))
          assert config["slug"] == "jk_epg"
          assert config["ingress"] is True
          assert set(config["arch"]) == {"amd64", "aarch64"}
          assert config["stage"] == "stable"
          manifest = __import__("json").load(open("jk_epg/custom_components/jk_epg/manifest.json"))
          assert manifest["version"] == config["version"]
          latest = next(line for line in pathlib.Path("jk_epg/CHANGELOG.md").read_text().splitlines() if line.startswith("## "))
          assert latest == f"## {config['version']}"
          assert pathlib.Path("jk_epg/logo.png").read_bytes().startswith(b"\x89PNG\r\n\x1a\n")

          config = yaml.safe_load(open("sdrconnect/config.yaml"))
          build = yaml.safe_load(open("sdrconnect/build.yaml"))
          assert config["slug"] == "sdrconnect"
          assert set(config["arch"]) == {"amd64", "aarch64"}
          assert config["usb"] is True and config["udev"] is True
          assert config["host_network"] is True
          args = build["args"]
          assert args["SDRCONNECT_BUILD"]
          assert all(
              len(args[key]) == 64 and int(args[key], 16) >= 0
              for key in ("SDRCONNECT_SHA256_AMD64", "SDRCONNECT_SHA256_AARCH64")
          )
          PY

      - name: Check add-on shell scripts
        run: |
          bash -n gps_ntp/run.sh
          bash -n sdrconnect/run.sh
          bash -n tvtest_epg_sync/run.sh
          bash -n xgps/run.sh
          sh -n jk_epg/run.sh
