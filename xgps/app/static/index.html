<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>xgps Web</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header>
    <div>
      <h1>xgps Web</h1>
      <span id="status" class="status disconnected" data-i18n="starting">Starting…</span>
      <div class="connection-meta">
        <span><span data-i18n="webConnection">Web</span>: <b id="web-status">—</b></span>
        <span><span data-i18n="endpoint">Endpoint</span>: <b id="endpoint">—</b></span>
        <span><span data-i18n="lastUpdate">Last update</span>: <b id="last-update">—</b></span>
        <span id="stale-warning" class="stale-warning" hidden data-i18n="staleData">Data is stale</span>
      </div>
    </div>
    <div class="controls">
      <label><span data-i18n="grid">Grid</span> <select id="grid"><option value="30">30°</option><option value="45">45°</option></select></label>
      <label><span data-i18n="projection">Projection</span> <select id="projection"><option value="linear">Linear</option><option value="spherical">Spherical</option></select></label>
      <label><span data-i18n="units">Units</span> <select id="units"><option value="metric">Metric</option><option value="nautical">Nautical</option><option value="imperial">Imperial</option></select></label>
      <label><span data-i18n="coordinates">Coordinates</span> <select id="coordinates"><option value="decimal">Decimal</option><option value="dms">DMS</option></select></label>
      <label><span data-i18n="timeMode">Time</span> <select id="time-mode"><option value="utc">UTC</option><option value="local">Local</option></select></label>
      <label><input id="labels" type="checkbox" checked> <span data-i18n="prnLabels">PRN labels</span></label>
      <button id="reset" type="button" data-i18n="resetView">Reset view</button>
    </div>
  </header>

  <main>
    <section class="card sky-card">
      <h2 data-i18n="skyView">Sky view</h2>
      <svg id="sky" viewBox="-110 -110 220 220" role="img" aria-label="Satellite sky view" data-i18n-aria="skyView"></svg>
      <div class="system-filter">
        <span data-i18n="showSystems">Show systems</span>
        <div id="legend" class="legend"></div>
        <div class="signal-legend">
          <span data-i18n="signalStrength">Signal strength</span>
          <span><i class="signal-gray"></i>&lt; 12</span>
          <span><i class="signal-red"></i>12–29</span>
          <span><i class="signal-yellow"></i>30–35</span>
          <span><i class="signal-green"></i>36–41</span>
          <span><i class="signal-cyan"></i>≥ 42</span>
        </div>
      </div>
    </section>

    <section class="card position-card">
      <h2 data-i18n="position">Position</h2>
      <dl id="position"></dl>
    </section>

    <section class="card table-card">
      <h2><span data-i18n="satellites">Satellites</span> <span id="sat-count">0</span></h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>GNSS</th><th>PRN</th><th data-i18n="elevation">El</th><th data-i18n="azimuth">Az</th><th>SNR</th><th data-i18n="used">Used</th></tr></thead>
          <tbody id="satellites"></tbody>
        </table>
      </div>
    </section>

    <section id="raw-card" class="card raw-card" hidden>
      <h2 data-i18n="rawJson">Raw JSON</h2>
      <pre id="raw"></pre>
    </section>
  </main>
  <script src="static/app.js"></script>
</body>
</html>
