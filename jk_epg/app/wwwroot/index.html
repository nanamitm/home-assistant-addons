<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JK EPG</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <button id="prev" aria-label="前日">‹</button>
    <input id="date" type="date">
    <button id="today">今日</button>
    <button id="now">現在</button>
    <button id="next" aria-label="翌日">›</button>
    <select id="band" aria-label="放送波">
      <option value="all">すべて</option>
      <option value="terrestrial">地上波</option>
      <option value="bs">BS・CS</option>
    </select>
    <details id="channel-filter">
      <summary id="channel-filter-summary">表示チャンネル</summary>
      <div id="channel-filter-panel">
        <div class="channel-filter-actions">
          <button type="button" data-channel-selection="all">全選択</button>
          <button type="button" data-channel-selection="terrestrial">地上波</button>
          <button type="button" data-channel-selection="bs">BS・CS</button>
          <button type="button" data-channel-selection="none">全解除</button>
        </div>
        <label class="favorite-only"><input id="favorite-only" type="checkbox"> お気に入りのみ表示</label>
        <div id="channel-filter-options"></div>
      </div>
    </details>
    <details id="genre-filter">
      <summary id="genre-filter-summary">全ジャンル</summary>
      <div id="genre-filter-panel">
        <button id="genre-filter-clear" type="button">全ジャンルに戻す</button>
        <div id="genre-filter-options"></div>
      </div>
    </details>
    <details id="legend">
      <summary>ジャンル凡例</summary>
      <div id="legend-items"></div>
    </details>
    <input id="program-search" type="search" placeholder="番組名を検索" aria-label="番組名を検索">
    <span id="search-count"></span>
    <button id="reload">表示更新</button>
    <details id="epg-status">
      <summary>取得状態</summary>
      <div id="epg-status-panel">
        <div id="epg-status-summary">確認中…</div>
        <div id="epg-source-status"></div>
        <button id="epg-refresh" type="button">外部EPGを今すぐ取得</button>
        <div id="epg-refresh-result" role="status"></div>
      </div>
    </details>
    <div class="view-switch" role="group" aria-label="表示形式">
      <button id="view-guide" type="button" class="active">番組表</button>
      <button id="view-now-next" type="button">現在・次</button>
    </div>
    <span id="status" role="status"></span>
  </header>
  <main id="viewport">
    <div id="loading">番組表を読み込んでいます…</div>
    <div id="guide" hidden></div>
    <div id="now-next" hidden></div>
  </main>
  <dialog id="program-dialog">
    <div class="dialog-head">
      <span id="dialog-channel"></span>
      <button id="dialog-close" type="button" aria-label="閉じる">×</button>
    </div>
    <h2 id="dialog-title"></h2>
    <dl>
      <div><dt>放送日時</dt><dd id="dialog-time"></dd></div>
      <div><dt>放送時間</dt><dd id="dialog-duration"></dd></div>
      <div><dt>ジャンル</dt><dd id="dialog-genre"></dd></div>
      <div><dt>取得元</dt><dd id="dialog-source"></dd></div>
    </dl>
  </dialog>
  <footer>番組情報は各提供元から取得しています。NHK番組の情報提供: NHK</footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
