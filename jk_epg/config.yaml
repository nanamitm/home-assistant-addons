name: JK EPG
version: "1.0.0"
slug: jk_epg
description: 日本のテレビ番組表を取得してHome Assistantで表示します
url: https://github.com/nanamitm/home-assistant-addons/tree/main/jk_epg
arch:
  - aarch64
  - amd64
init: false
startup: application
stage: stable
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:television-guide
panel_title: 番組表
panel_admin: false
watchdog: http://[HOST]:[PORT:8099]/api/health
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Web UI (Ingressを使わない場合のみ)
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
options:
  timezone: Asia/Tokyo
  update_interval: 3600
  retention_days: 60
  nhk_area: "130"
  nhk_api_key: ""
  enable_atx: true
  enable_ouj: true
  enable_subchannels: true
  install_ha_integration: true
schema:
  timezone: str
  update_interval: "int(3600,86400)"
  retention_days: "int(1,365)"
  nhk_area: str
  nhk_api_key: password
  enable_atx: bool
  enable_ouj: bool
  enable_subchannels: bool
  install_ha_integration: bool
